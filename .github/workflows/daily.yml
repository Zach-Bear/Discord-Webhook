name: Geoguessr Daily Challenge

on:
  workflow_dispatch: # Can trigger manually for testing

jobs:
  post-challenge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run script
        env:
          NCFA_TOKEN: ${{ secrets.NCFA_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          MAP_ID: ${{ secrets.MAP_ID }}
          ROLE_ID: ${{ secrets.ROLE_ID }}
          TIME_LIMIT: ${{ vars.TIME_LIMIT }}
          FORBID_MOVING: ${{ vars.FORBID_MOVING }}
          FORBID_ZOOMING: ${{ vars.FORBID_ZOOMING }}
          FORBID_ROTATING: ${{ vars.FORBID_ROTATING }}
        run: python daily_challenge.py
